name: Demo

on:
  push:
    branches: [main]
    paths:
      - demo.tape
      - cmd/**
      - internal/**
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install ffmpeg and ttyd
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo install -m 755 /tmp/ttyd /usr/local/bin/ttyd
      - name: Install vhs
        # v0.11.0 is what renders on this runner for kanywst/y509; v0.12.0
        # exited 0 there without writing the file.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/charmbracelet/vhs@v0.11.0
      - name: Render demo.gif
        run: |
          rm -f demo.gif
          vhs demo.tape
          if [ ! -s demo.gif ] || [ "$(head -c 4 demo.gif)" != "GIF8" ] || [ "$(tail -c 1 demo.gif)" != ";" ]; then
            echo "::error::vhs did not write a usable demo.gif"
            exit 1
          fi
      - name: Commit if changed
        run: |
          git diff --quiet -- demo.gif && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo.gif
          git commit -m "chore(demo): refresh demo.gif"
          git push
