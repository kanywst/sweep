version: 2

project_name: sweep

before:
  hooks:
    - go mod tidy

builds:
  - binary: sweep
    main: ./cmd/sweep
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # sweep reads ports through lsof and ps, so only Unix targets.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/kanywst/sweep/internal/version.Version={{.Version}} -X github.com/kanywst/sweep/internal/version.GitCommit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  prerelease: auto
  replace_existing_artifacts: true

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
    output: true

homebrew_casks:
  - name: sweep
    binaries: [sweep]
    # A v1.2.3-rc1 tag is a prerelease; keep it out of the tap.
    skip_upload: auto
    # Casks are downloaded with curl, so the binary carries com.apple.quarantine
    # and Gatekeeper refuses to run it unsigned. Same step as y509.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/sweep"]
        end
      end
    homepage: "https://github.com/kanywst/sweep"
    description: "Find the dev servers you left running and sweep them away"
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"

nfpms:
  - maintainer: kanywst
    description: Find the dev servers you left running and sweep them away
    homepage: https://github.com/kanywst/sweep
    license: Apache-2.0
    formats: [deb, rpm]
    # sweep reads ports with lsof and the process table with ps.
    dependencies: [lsof, procps]
    overrides:
      rpm:
        dependencies: [lsof, procps-ng]
